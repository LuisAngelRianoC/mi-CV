<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Currículum - Luis Angel Riaño Calixto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div id="google_translate_element"></div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'es,en,ja'
      }, 'google_translate_element');
    }
  </script>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- PERFIL -->
      <section class="perfil-section">
        <!-- <div class="profile-photo-container">
          <img src="./img/perfil.jpg" alt="Foto de perfil" class="profile-photo">
        </div> -->
        <div class="profile-text">
          <h1 id="profile-name"></h1>
          <h2 id="profile-title"></h2>
          <p id="profile-specialties" class="profile-specialties"></p>
          <p id="profile-headline" class="profile-headline"></p>
        </div>
      </section>

      <!-- CONTACTO -->
      <section>
        <h3 data-catalog-heading="contact"></h3>
        <div id="contact-list"></div>
      </section>

      <!-- EDUCACIÓN -->
      <section>
        <h3 data-catalog-heading="education"></h3>
        <div id="education-list"></div>
      </section>

      <!-- IDIOMAS -->
      <section>
        <h3 data-catalog-heading="languages"></h3>
        <div id="language-list"></div>
      </section>

    </aside>

    <!-- MAIN -->
    <main>

      <!-- PERFIL -->
      <section class="perfil">
        <h3 data-catalog-heading="profile"></h3>
        <p id="profile-summary"></p>

        <!-- HABILIDADES BLANDAS -->
        <div class="soft-skills">
          <h4 data-catalog-heading="softSkills"></h4>
          <p id="soft-skills-list"></p>
        </div>
      </section>

      <!-- EXPERIENCIA -->
      <section>
        <h3 data-catalog-heading="experience"></h3>
        <div id="experience-list"></div>

      </section>

      <!-- CONOCIMIENTOS -->
      <section>
        <h2 class="titulo" data-catalog-heading="knowledge"></h2>
        <div class="knowledge-section" id="knowledge-list"></div>
      </section>

      <!-- CERTIFICADOS -->
      <section>
        <h3 data-catalog-heading="certificates"></h3>
        <ul class="certificate-list" id="certificate-list"></ul>
      </section>

      <!-- PROYECTOS -->
      <section>
        <h3 data-catalog-heading="projects"></h3>
        <div class="project-list" id="project-list"></div>
      </section>

      <footer>
        <span id="footer-text"></span>
      </footer>
    </main>
  </div>

  <!-- BOTONES TRADUCIR FIJO -->
  <div class="translate">
    <button onclick="translateTo('es')">ES</button>
    <button onclick="translateTo('en')">EN</button>
    <button onclick="translateTo('ja')">JP</button>
  </div>

  <script src="script.js"></script>

</body>

</html>
