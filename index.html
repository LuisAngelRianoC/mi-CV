<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Currículum - Luis Angel Riaño Calixto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div id="google_translate_element"></div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'es,en,ja'
      }, 'google_translate_element');
    }
  </script>

  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <nav class="top-menu" aria-label="Opciones del currículum">
    <div class="profile-switch" aria-label="Seleccionar perfil profesional">
      <span>Perfil:</span>
      <button type="button" class="profile-switch-button is-active" data-profile-file="./data.json" aria-pressed="true">
        Sistemas
      </button>
      <button type="button" class="profile-switch-button" data-profile-file="./data-mesero.json" aria-pressed="false">
        Servicio al cliente
      </button>
    </div>
    <div class="menu-actions">
      <div class="translate" aria-label="Seleccionar idioma">
        <button type="button" data-language="es" aria-label="Ver en español">ES</button>
        <button type="button" data-language="en" aria-label="Ver en inglés">EN</button>
        <button type="button" data-language="ja" aria-label="Ver en japonés">JP</button>
      </div>
      <button type="button" class="export-pdf" id="export-pdf">
        <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
        Exportar PDF
      </button>
    </div>
    <span class="translate-status" id="translate-status" role="status" aria-live="polite"></span>
  </nav>

  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- PERFIL -->
      <section class="perfil-section">
        <!-- <div class="profile-photo-container">
          <img src="./img/perfil.jpg" alt="Foto de perfil" class="profile-photo">
        </div> -->
        <div class="profile-text">
          <h1 id="profile-name"></h1>
          <h2 id="profile-title"></h2>
          <p id="profile-specialties" class="profile-specialties"></p>
          <p id="profile-headline" class="profile-headline"></p>
        </div>
      </section>

      <!-- CONTACTO -->
      <section data-profile-section="contact">
        <h3 data-catalog-heading="contact"></h3>
        <div id="contact-list"></div>
      </section>

      <!-- EDUCACIÓN -->
      <section data-profile-section="education">
        <h3 data-catalog-heading="education"></h3>
        <div id="education-list"></div>
      </section>

      <!-- IDIOMAS -->
      <section data-profile-section="languages">
        <h3 data-catalog-heading="languages"></h3>
        <div id="language-list"></div>
      </section>

    </aside>

    <!-- MAIN -->
    <main>

      <!-- PERFIL -->
      <section class="perfil" data-profile-section="summary">
        <h3 data-catalog-heading="profile"></h3>
        <p id="profile-summary"></p>

        <!-- HABILIDADES BLANDAS -->
        <div class="soft-skills" data-profile-section="softSkills">
          <h4 data-catalog-heading="softSkills"></h4>
          <p id="soft-skills-list"></p>
        </div>
      </section>

      <!-- EXPERIENCIA -->
      <section data-profile-section="experience">
        <h3 data-catalog-heading="experience"></h3>
        <div id="experience-list"></div>

      </section>

      <!-- CONOCIMIENTOS -->
      <section data-profile-section="knowledge">
        <h2 class="titulo" data-catalog-heading="knowledge"></h2>
        <div class="knowledge-section" id="knowledge-list"></div>
      </section>

      <!-- CERTIFICADOS -->
      <section data-profile-section="certificates">
        <h3 data-catalog-heading="certificates"></h3>
        <ul class="certificate-list" id="certificate-list"></ul>
      </section>

      <!-- PROYECTOS -->
      <section data-profile-section="projects">
        <h3 data-catalog-heading="projects"></h3>
        <div class="project-list" id="project-list"></div>
      </section>

      <footer>
        <span id="footer-text"></span>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>

</body>

</html>
